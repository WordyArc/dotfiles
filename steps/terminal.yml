---

- clean: ['~']

# See https://ohmyz.sh
- shell:
  - command: |
      sh -c \
        "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      || true
    description: Install Oh-My-Zsh
    stdout: true
    stderr: true

- link:
  # Terminal:
  ~/.shell:
    path: shell
    create: true
  ~/.zshrc:
    path: config/zshrc
    force: true
